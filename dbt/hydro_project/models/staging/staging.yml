version: 2

sources:
  - name: postgres
    schema: public
    tables:
      - name: raw_discharge

models:
  - name: stg_raw_discharge
    description: "Cleaned staging model for discharge measurements."
    columns:
      - name: station_id
        description: "Unique station identifier."
        tests:
          - not_null

      - name: time
        description: "Timestamp of the discharge measurement."
        tests:
          - not_null

      - name: value
        description: "Discharge value in cubic meters per second."
        tests:
          - not_null
