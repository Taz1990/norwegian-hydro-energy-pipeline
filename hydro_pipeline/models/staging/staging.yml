version: 2

sources:
  - name: postgres
    schema: public
    tables:
      - name: raw_discharge

models:
  - name: stg_raw_discharge
    description: "Cleaned staging model for discharge measurements."
    columns:
      - name: station_id
        tests:
          - not_null
      - name: time
        tests:
          - not_null
      - name: value
        tests:
          - not_null
