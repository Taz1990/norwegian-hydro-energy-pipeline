version: 2

sources:
  - name: postgres
    schema: public
    tables:
      - name: raw_discharge
      - name:
          stations

          # First Model Block
models:
  - name: stg_raw_discharge
    description: "Cleaned staging model for discharge measurements."
    columns:
      - name: station_id
        description: "Unique station identifier."
        tests:
          - not_null

      - name: time
        description: "Timestamp of the discharge measurement."
        tests:
          - not_null

      - name: value
        description: "Discharge value in cubic meters per second."
        tests:
          - not_null
            # Second Model Block
  - name: stg_stations
    description: "Cleaned staging model for station metadata."
    columns:
      - name: station_id
        description: "Unique station identifier."
        tests:
          - unique
          - not_null

      - name: station_name
        description: "Human-readable name of the station."
        tests:
          - not_null
